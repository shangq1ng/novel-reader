[package]
name = "novel-reader"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "novel-reader-backend"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0.15.7"
env = "1.0.1"
futures-util = "0.3.34"
oauth2 = { version = "5.0.0", features = ["default", "reqwest"] }
rust-s3 = "0.37.2"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "macros", "chrono", "postgres", "uuid", "derive"] }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower-sessions = "=0.14.0"
tower-sessions-redis-store = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde"] }
validator = "0.21.0"
reqwest = { version = "=0.12.28", features = ["json"] }
serde_json = "1.0.151"
